server {
    listen 80;
    server_name _;
    root /var/www/html/web;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass yii:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
